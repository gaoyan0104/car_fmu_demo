name: Review automation
run-name: 'PR review · ${{ inputs.branch || github.ref_name }}'

on:
  push:
    branches: ['work/**']
  workflow_dispatch:
    inputs:
      branch:
        description: 'Existing work/<task> branch in this repository'
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      actions: write
    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}
    steps:
      - name: Create or find the task PR
        id: pr
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          TASK_BRANCH: ${{ inputs.branch || github.ref_name }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const branch = process.env.TASK_BRANCH?.trim();
            if (!branch?.startsWith('work/') || branch.length <= 5) {
              throw new Error('请指定本仓库已有的 work/<任务名> 分支。');
            }
            const skip = async message => {
              core.notice(message);
              await core.summary.addHeading('跳过审查').addRaw(message).write();
            };
            const {data: metadata} = await github.rest.repos.get({owner, repo});
            const [{data: head}, {data: base}] = await Promise.all([
              github.rest.repos.getBranch({owner, repo, branch}),
              github.rest.repos.getBranch({owner, repo, branch: metadata.default_branch})
            ]);
            if (context.eventName === 'push' && context.sha !== head.commit.sha) {
              await skip('该分支已有更新提交，由较新的推送触发审查。');
              return;
            }
            const {data: comparison} = await github.rest.repos.compareCommitsWithBasehead({
              owner, repo, basehead: `${base.commit.sha}...${head.commit.sha}`, per_page: 1
            });
            if (comparison.ahead_by === 0 || comparison.files?.length === 0) {
              await skip('当前分支与默认分支没有可审查的文件差异，无需创建 PR 或调用 AI。');
              return;
            }
            const findPr = async () => (await github.rest.pulls.list({
              owner, repo, head: `${owner}:${branch}`, base: metadata.default_branch, state: 'open'
            })).data[0];
            let pr = await findPr();
            if (!pr) {
              try {
                pr = (await github.rest.pulls.create({
                  owner, repo, head: branch, base: metadata.default_branch, draft: true,
                  title: branch.slice(5).replace(/[-_/]+/g, ' '),
                  body: '## 任务目标\n\n说明本次要解决的问题或实现的功能。\n\n## 改动范围\n\n说明涉及的模块或接口，以及本次暂不处理的内容。'
                })).data;
              } catch (error) {
                // Another run may have created the same PR after our lookup.
                if (error.status !== 422) throw error;
                pr = await findPr();
                if (!pr) throw error;
              }
            }
            core.setOutput('pr_number', pr.number);
            await core.summary.addHeading('PR 已准备好').addLink(`PR #${pr.number}`, pr.html_url).write();
            // The pinned Claude Code Action accepts workflow_dispatch, not push.
            // Only push runs dispatch; the dispatched run proceeds to review.
            if (context.eventName === 'push') {
              await github.rest.actions.createWorkflowDispatch({
                owner, repo, workflow_id: 'review-automation.yml',
                ref: metadata.default_branch, inputs: {branch}
              });
              core.notice(`Requested AI review for PR #${pr.number} from the default branch workflow.`);
            }

  review:
    name: AI review and summary
    needs: prepare
    if: github.event_name == 'workflow_dispatch' && needs.prepare.outputs.pr_number != ''
    runs-on: ${{ vars.AI_REVIEW_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    concurrency:
      group: pr-review-${{ github.repository }}-${{ needs.prepare.outputs.pr_number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    env:
      SUMMARY_MARKER: '<!-- ai-pr-review -->'
      ANTHROPIC_BASE_URL: ${{ vars.AI_REVIEW_BASE_URL || 'https://api.deepseek.com/anthropic' }}
      ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ vars.AI_REVIEW_MODEL || 'deepseek-flash' }}
      ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ vars.AI_REVIEW_MODEL || 'deepseek-flash' }}
      ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ vars.AI_REVIEW_MODEL || 'deepseek-flash' }}
    steps:
      - name: Check the PR and review configuration
        id: current
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          HAS_API_KEY: ${{ secrets.DEEPSEEK_API_KEY != '' }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const {data: pr} = await github.rest.pulls.get({
              owner, repo, pull_number: Number(process.env.PR_NUMBER)
            });
            if (pr.state !== 'open' || pr.changed_files === 0) {
              core.notice('PR 已关闭或已无文件差异，跳过审查。');
              return;
            }
            if (pr.head.repo?.full_name.toLowerCase() !== `${owner}/${repo}`.toLowerCase() ||
                !pr.head.ref.startsWith('work/')) {
              throw new Error('只支持本仓库的 work/<任务名> 分支。');
            }
            if (process.env.HAS_API_KEY !== 'true') {
              throw new Error('请先在仓库 Actions Secrets 中配置 DEEPSEEK_API_KEY。');
            }
            const {data: base} = await github.rest.repos.getBranch({owner, repo, branch: pr.base.ref});
            // Resolve the latest head only after acquiring this PR's concurrency slot.
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('base_sha', base.commit.sha);
            core.setOutput('started_at', new Date().toISOString());
            core.setOutput('ready', 'true');
      - name: Load the default branch review prompt
        if: steps.current.outputs.ready == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.current.outputs.base_sha }}
          persist-credentials: false
      - name: Review with the official Claude Code Action
        if: steps.current.outputs.ready == 'true'
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1
        with:
          github_token: ${{ github.token }}
          anthropic_api_key: ${{ secrets.DEEPSEEK_API_KEY }}
          allowed_bots: 'github-actions[bot]'
          path_to_claude_code_executable: ${{ runner.environment == 'self-hosted' && vars.AI_REVIEW_CLAUDE_PATH || '' }}
          classify_inline_comments: 'false'
          show_full_output: 'false'
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ needs.prepare.outputs.pr_number }}
            REVIEWED HEAD SHA: ${{ steps.current.outputs.head_sha }}
            DEFAULT BRANCH SHA: ${{ steps.current.outputs.base_sha }}
            SUMMARY MARKER: ${{ env.SUMMARY_MARKER }}

            请读取并执行 .github/prompts/review.md 中的审查指令。
          claude_args: >-
            --model ${{ vars.AI_REVIEW_MODEL || 'deepseek-flash' }}
            --max-turns 30
            --tools "Read,Glob,Grep,Bash"
            --allowedTools "Read,Glob,Grep,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh api --method GET:*),Bash(gh pr comment:*),Bash(gh api --method PATCH repos/${{ github.repository }}/issues/comments/*)"
      - name: Confirm the review summary was published
        if: steps.current.outputs.ready == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          REVIEWED_HEAD: ${{ steps.current.outputs.head_sha }}
          STARTED_AT: ${{ steps.current.outputs.started_at }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const pull_number = Number(process.env.PR_NUMBER);
            const {data: pr} = await github.rest.pulls.get({owner, repo, pull_number});
            if (pr.state !== 'open' || pr.head.sha !== process.env.REVIEWED_HEAD) {
              core.notice('PR 已关闭或已有新提交，本轮结果已过期。');
              return;
            }
            // GitHub uses the issue-comment API for ordinary PR comments too.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pull_number, per_page: 100
            });
            const summary = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' &&
              comment.body?.startsWith(process.env.SUMMARY_MARKER) &&
              comment.body.includes(process.env.REVIEWED_HEAD) &&
              Date.parse(comment.updated_at) >= Date.parse(process.env.STARTED_AT) - 2000
            );
            if (!summary) {
              throw new Error('AI 任务已结束，但未找到本轮已发布的 PR 总结。请检查模型输出与工具权限。');
            }
            await core.summary.addHeading('AI 审查总结已发布')
              .addLink(`PR #${pull_number} 审查总结`, summary.html_url).write();
